<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="MarginLab — Portföy destekli margin karar stüdyosu. Margin mekaniğini öğren, trade'i açmadan önce riske et." />
    <script>
      // Tema yanıp sönmesini (flash) engelle
      (function () {
        try {
          var t = localStorage.getItem('mc-theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
      // Sayfa yüklenirken doğru <html lang> ile başla (flash yok)
      (function () {
        try {
          var l = localStorage.getItem('marginlab.locale');
          if (l !== 'en' && l !== 'tr') l = 'tr';
          document.documentElement.setAttribute('lang', l);
        } catch (e) {
          document.documentElement.setAttribute('lang', 'tr');
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
